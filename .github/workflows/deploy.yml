name: Auto Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo, dom, curl, gd, zip, fileinfo, bcmath

      - name: Install Composer
        run: composer install --no-dev --no-interaction --ignore-platform-reqs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          npm ci
          npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          script: |
            cd ${{ secrets.HOSTINGER_PROJECT_PATH }}
            php artisan down || true
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --no-interaction --ignore-platform-reqs
            npm ci
            npm run build
            php artisan migrate --force
            php artisan optimize
            php artisan up