name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: npm ci && npm run build

      - name: Upload built frontend assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          source: "public/build/**"
          target: "/home/u234139505/domains/inventoryai.id/skm-ekp-app/public/build"
          strip_components: 2
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          envs: REPO_ACCESS_TOKEN
          script: |
            set -e
            PROJECT=/home/u234139505/domains/inventoryai.id/skm-ekp-app
            PUBLIC=/home/u234139505/domains/inventoryai.id/public_html/ekp
            
            echo "=== Project state ==="
            ls -la "$PROJECT" || echo "Project folder not found"
            
            if [ ! -f "$PROJECT/composer.json" ]; then
              echo "=== Cloning repository ==="
              cd /
              rm -rf "$PROJECT"
              git clone "https://${REPO_ACCESS_TOKEN}@github.com/Ghostwisnu/skm-ekp-app.git" "$PROJECT"
            fi
            
            echo "=== Updating code ==="
            cd "$PROJECT"
            git remote set-url origin "https://${REPO_ACCESS_TOKEN}@github.com/Ghostwisnu/skm-ekp-app.git"
            git fetch origin main
            git reset --hard origin/main
            
            echo "=== Composer install ==="
            composer install --no-dev --optimize-autoloader --no-interaction
            
            echo "=== Create .env ==="
            cat > .env << ENVEOF
APP_NAME=Laravel
APP_ENV=production
APP_KEY=${{ secrets.APP_KEY }}
APP_DEBUG=false
APP_URL=https://inventoryai.id/ekp
DB_CONNECTION=${{ secrets.DB_CONNECTION }}
DB_HOST=${{ secrets.DB_HOST }}
DB_PORT=${{ secrets.DB_PORT }}
DB_DATABASE=${{ secrets.DB_DATABASE }}
DB_USERNAME=${{ secrets.DB_USERNAME }}
DB_PASSWORD=${{ secrets.DB_PASSWORD }}
SESSION_DRIVER=database
SESSION_PATH=/ekp
VITE_APP_NAME=Laravel
VITE_BASE_URL=/ekp
ENVEOF
            
            echo "=== Clear caches ==="
            php artisan config:clear
            php artisan route:clear
            
            echo "=== Migrate ==="
            php artisan migrate --force || true
            
            echo "=== Seed ==="
            php artisan db:seed --force || true
            
            echo "=== Optimize ==="
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
            
            echo "=== Sync public ==="
            rm -rf "$PUBLIC"
            mkdir -p "$PUBLIC"
            cp -a public/. "$PUBLIC"/
            php artisan storage:link || true
            
            echo "=== Health check ==="
            php artisan about || true
            
            echo "✅ Deploy Success"
