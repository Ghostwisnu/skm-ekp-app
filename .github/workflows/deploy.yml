name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, json, mysql, curl, gd, zip, dom, simplexml
          ini-values: memory_limit=512M

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Cache NPM packages
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install NPM packages
        run: npm ci

      - name: Build frontend
        env:
          VITE_BASE_URL: /ekp
        run: npm run build

      - name: Create .env from secrets
        run: |
          cp .env.example .env
          sed -i "s|APP_KEY=.*|APP_KEY=${{ secrets.APP_KEY }}|" .env
          sed -i "s|DB_CONNECTION=.*|DB_CONNECTION=${{ secrets.DB_CONNECTION }}|" .env
          sed -i "s|DB_HOST=.*|DB_HOST=${{ secrets.DB_HOST }}|" .env
          sed -i "s|DB_PORT=.*|DB_PORT=${{ secrets.DB_PORT }}|" .env
          sed -i "s|DB_DATABASE=.*|DB_DATABASE=${{ secrets.DB_DATABASE }}|" .env
          sed -i "s|DB_USERNAME=.*|DB_USERNAME=${{ secrets.DB_USERNAME }}|" .env
          sed -i "s|DB_PASSWORD=.*|DB_PASSWORD=${{ secrets.DB_PASSWORD }}|" .env
          echo "✅ .env created"

      - name: Upload built frontend assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          source: "public/build/**"
          target: "/home/u234139505/domains/inventoryai.id/skm-ekp-app/public/build"
          strip_components: 2
          overwrite: true

      - name: Upload .env to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          source: ".env"
          target: "/home/u234139505/domains/inventoryai.id/skm-ekp-app/.env"
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          envs: REPO_ACCESS_TOKEN
          script: |
            set -e
            PROJECT=/home/u234139505/domains/inventoryai.id/skm-ekp-app
            PUBLIC=/home/u234139505/domains/inventoryai.id/public_html/ekp
            ssh-keyscan -t ed25519,ecdsa,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            echo "=== Project state ==="
            ls -la "$PROJECT" 2>/dev/null | head -20 || echo "Project folder does not exist"

            if [ ! -f "$PROJECT/composer.json" ]; then
              echo "=== composer.json missing - re-cloning repository ==="
              if [ -f "$PROJECT/.env" ]; then
                cp "$PROJECT/.env" /tmp/skm-ekp.env
              fi
              cd /
              rm -rf "$PROJECT"
              git clone "https://${REPO_ACCESS_TOKEN}@github.com/Ghostwisnu/skm-ekp-app.git" "$PROJECT"
              if [ -f /tmp/skm-ekp.env ]; then
                cp /tmp/skm-ekp.env "$PROJECT/.env"
              fi
            fi

            cd "$PROJECT"
            echo "=== Updating code ==="
            git remote set-url origin "https://${REPO_ACCESS_TOKEN}@github.com/Ghostwisnu/skm-ekp-app.git"
            git fetch origin main
            git reset --hard origin/main

            echo "=== Composer ==="
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
            rm -f bootstrap/cache/config.php bootstrap/cache/services.php bootstrap/cache/packages.php
            php artisan package:discover --ansi

            echo "=== Checking .env ==="
            ls -la .env
            grep "APP_KEY" .env
            grep "DB_CONNECTION" .env
            grep "DB_HOST" .env

            echo "=== Database ==="
            php artisan config:clear
            php artisan route:clear
            php artisan migrate --force || true
            php artisan db:seed --force || true

            echo "=== Optimize ==="
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize

            echo "=== Sync public folder ==="
            rm -rf "$PUBLIC"
            mkdir -p "$PUBLIC"
            cp -a public/. "$PUBLIC"/
            php artisan storage:link || true

            echo "=== Testing app health ==="
            php artisan about 2>&1 | head -30 || true

            echo "=== Deploy Complete ==="
