name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_mysql, bcmath, xml, curl, zip, gd
          ini-values: memory_limit=512M
          coverage: none

      - name: Setup Composer
        uses: ramsey/composer-install@v3
        with:
          composer-options: --no-dev --optimize-autoloader --no-interaction

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: npm ci && npm run build

      - name: Upload built frontend assets
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          source: "public/build/**"
          target: "/home/u234139505/domains/inventoryai.id/skm-ekp-app/public/build"
          strip_components: 2
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          envs: REPO_ACCESS_TOKEN
          script: |
            set -e
            PROJECT=/home/u234139505/domains/inventoryai.id/skm-ekp-app
            PUBLIC=/home/u234139505/domains/inventoryai.id/public_html/ekp

            echo "=== Project state ==="
            ls -la "$PROJECT" || echo "Project folder not found"

            if [ ! -f "$PROJECT/composer.json" ]; then
              echo "=== Cloning repository ==="
              cd /
              rm -rf "$PROJECT"
              git clone "https://${REPO_ACCESS_TOKEN}@github.com/Ghostwisnu/skm-ekp-app.git" "$PROJECT"
            fi

            echo "=== Updating code ==="
            cd "$PROJECT"
            git fetch origin main
            git reset --hard origin/main

            echo "=== Composer install ==="
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

            echo "=== Create .env ==="
            cat > .env << ENVEOF
            APP_NAME=Laravel
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=https://inventoryai.id/ekp
            DB_CONNECTION=${{ secrets.DB_CONNECTION }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            SESSION_DRIVER=database
            SESSION_PATH=/ekp
            VITE_APP_NAME=Laravel
            VITE_BASE_URL=/ekp
            ENVEOF

            echo "=== Verify .env ==="
            grep -q "APP_KEY" .env && echo "APP_KEY present" || echo "WARNING: APP_KEY missing"
            grep -q "DB_DATABASE" .env && echo "DB_DATABASE present" || echo "WARNING: DB_DATABASE missing"

            echo "=== Discover packages ==="
            php artisan package:discover --ansi

            echo "=== Clear caches ==="
            php artisan config:clear
            php artisan route:clear

            echo "=== Migrate ==="
            php artisan migrate --force

            echo "=== Seed ==="
            php artisan db:seed --force || true

            echo "=== Optimize ==="
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize

            echo "=== Restart queue workers ==="
            php artisan queue:restart || true

            echo "=== Sync public ==="
            rm -rf "$PUBLIC"
            mkdir -p "$PUBLIC"
            cp -a public/. "$PUBLIC"/

            echo "=== Fix index.php path ==="
            sed -i 's|__DIR__.\x27/../vendor/autoload.php\x27|__DIR__.\x27../../skm-ekp-app/vendor/autoload.php\x27|g' "$PUBLIC/index.php"
            sed -i 's|__DIR__.\x27/../bootstrap/app.php\x27|__DIR__.\x27../../skm-ekp-app/bootstrap/app.php\x27|g' "$PUBLIC/index.php"
            sed -i 's|__DIR__.\x27/../storage/framework/maintenance.php\x27|__DIR__.\x27../../skm-ekp-app/storage/framework/maintenance.php\x27|g' "$PUBLIC/index.php"

            echo "=== Fix permissions ==="
            chmod -R 755 storage bootstrap/cache
            chown -R $USER:$USER storage bootstrap/cache 2>/dev/null || true

            echo "=== Storage link ==="
            rm -f public/storage
            php artisan storage:link 2>/dev/null || true

            echo "=== Test DB connection ==="
            php artisan tinker --execute='echo "DB connected: " . (DB::connection()->getPdo() ? "yes" : "no");' || echo "DB test skipped"

            echo "=== Health check ==="
            php artisan --version

            echo "=== Laravel log (last 30 lines) ==="
            tail -n 30 storage/logs/laravel.log 2>/dev/null || echo "No log file found"

            echo "✅ Deploy Success"
