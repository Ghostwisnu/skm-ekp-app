name: Auto Deploy to Hostinger

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    name: Build & Deploy to Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐘 Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo, dom, curl, gd, zip, fileinfo, bcmath

      - name: 📦 Install Composer Dependencies
        run: composer install --no-dev --no-interaction --ignore-platform-reqs

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🎨 Build Frontend Assets
        run: |
          npm ci
          VITE_BASE_URL=/ekp/build/ npm run build

      - name: 🔑 Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}

      - name: 📤 Upload Files to Hostinger via Rsync
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.HOSTINGER_PORT || 65002 }} -H ${{ secrets.HOSTINGER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          
          rsync -avz --delete -e "ssh -p ${{ secrets.HOSTINGER_PORT || 65002 }} -o StrictHostKeyChecking=no" \
            --exclude='.env' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='storage/*.key' \
            --exclude='storage/framework/maintenance.php' \
            ./ ${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.HOSTINGER_PROJECT_PATH }}/

          rsync -avz --delete -e "ssh -p ${{ secrets.HOSTINGER_PORT || 65002 }} -o StrictHostKeyChecking=no" \
            public/build/ ${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:/home/u234139505/domains/inventoryai.id/public_html/ekp/build/

      - name: ⚡ Run Artisan Commands on Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          script: |
            cd ${{ secrets.HOSTINGER_PROJECT_PATH }}
            echo "=== Starting Deployment ==="
            php artisan down || true
            
            # Fix SESSION_PATH in .env — strip any double-prefix bug from previous sed commands
            sed -i 's|SESSION_PATH=/.*|SESSION_PATH=/ekp|' .env
            # Set APP_SUBPATH for Fortify redirect paths
            sed -i 's|APP_SUBPATH=.*|APP_SUBPATH=/ekp|' .env
            # Set correct APP_URL for subdirectory deployment
            sed -i 's|APP_URL=.*|APP_URL=https://inventoryai.id/ekp|' .env
            
            composer install --no-dev --no-interaction --ignore-platform-reqs
            php artisan migrate --force
            php artisan db:seed --class=DatabaseSeeder || true
            php artisan optimize:clear
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
            php artisan up
            echo "=== Deployment Complete ==="