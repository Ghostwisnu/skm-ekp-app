name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          port: ${{ secrets.HOSTINGER_PORT }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          script: |
            set -e
            PROJECT=/home/u234139505/domains/inventoryai.id/skm-ekp-app
            PUBLIC=/home/u234139505/domains/inventoryai.id/public_html/ekp
            ssh-keyscan -t ed25519,ecdsa,rsa github.com >> ~/.ssh/known_hosts 2>/dev/null || true

            echo "=== Project state ==="
            ls -la "$PROJECT" 2>/dev/null | head -30 || echo "Project folder does not exist"

            if [ ! -f "$PROJECT/composer.json" ]; then
              echo "=== composer.json missing - re-cloning repository ==="
              if [ -f "$PROJECT/.env" ]; then
                cp "$PROJECT/.env" /tmp/skm-ekp.env
              fi
              cd /
              rm -rf "$PROJECT"
              git clone "https://${{ secrets.REPO_ACCESS_TOKEN }}@github.com/Ghostwisnu/skm-ekp-app.git" "$PROJECT"
              if [ -f /tmp/skm-ekp.env ]; then
                cp /tmp/skm-ekp.env "$PROJECT/.env"
              fi
            fi

            cd "$PROJECT"
            echo "=== Updating code ==="
            git remote set-url origin "https://${{ secrets.REPO_ACCESS_TOKEN }}@github.com/Ghostwisnu/skm-ekp-app.git"
            git fetch origin main
            git reset --hard origin/main

            echo "=== Composer ==="
            composer install --no-dev --optimize-autoloader --no-interaction --no-scripts
            rm -f bootstrap/cache/config.php bootstrap/cache/services.php bootstrap/cache/packages.php
            php artisan package:discover --ansi

            echo "=== Frontend ==="
            npm ci
            npm run build

            echo "=== Database ==="
            php artisan config:clear
            php artisan route:clear
            php artisan migrate --force
            php artisan db:seed --force || true

            echo "=== Optimize ==="
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize

            echo "=== Sync public folder ==="
            rm -rf "$PUBLIC"
            mkdir -p "$PUBLIC"
            cp -a public/. "$PUBLIC"/
            php artisan storage:link || true

            echo "=== Deploy Complete ==="
