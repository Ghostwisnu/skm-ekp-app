name: Auto Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo, dom, curl, gd, zip, fileinfo, bcmath

      - name: Install Composer
        run: composer install --no-dev --no-interaction --ignore-platform-reqs

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          npm ci
          npm run build

      - name: Deploy via SSH Key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT || 65002 }}
          script: |
            PROJECT_PATH="${{ secrets.HOSTINGER_PROJECT_PATH }}"
            echo "=== DEBUG: Using Project Path ==="
            echo "$PROJECT_PATH"
            cd "$PROJECT_PATH"
            echo "=== DEBUG: Current Directory ==="
            pwd
            echo "=== DEBUG: List Files ==="
            ls -la
            echo "=== DEBUG: Check artisan ==="
            if [ ! -f "artisan" ]; then
              echo "ERROR: artisan not found!"
              exit 1
            fi
            echo "=== DEBUG: Check composer.json ==="
            if [ ! -f "composer.json" ]; then
              echo "ERROR: composer.json not found!"
              exit 1
            fi
            echo "=== DEBUG: Check npm ==="
            if ! command -v npm &> /dev/null; then
              echo "ERROR: npm not found! Install Node.js via Hostinger hPanel → Node.js"
              exit 1
            fi
            echo "=== DEBUG: Check git ==="
            if [ ! -d ".git" ]; then
              echo "ERROR: Not a git repository! Run: git init && git remote add origin <url>"
              exit 1
            fi
            php artisan down || true
            git fetch origin main
            git reset --hard origin/main
            composer install --no-dev --no-interaction --ignore-platform-reqs
            npm ci
            npm run build
            php artisan migrate --force
            php artisan optimize
            php artisan up